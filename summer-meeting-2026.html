<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
  --bg:#070b16; --panel:#111a2e; --line:#22324f;
  --cyan:#2dd4ff; --blue:#3b6bff; --green:#39e08a;
  --red:#ff4d6d; --amber:#ffb84d; --gold:#f59e0b;
  --purple:#a78bfa; --text:#e9eefb; --muted:#8794b3;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg); color:var(--text);
  min-height:100vh; display:flex;
  align-items:center; justify-content:center;
  padding:16px;
}
.app {
  width:100%; max-width:780px;
  background:linear-gradient(180deg,#16223cdd,#0d1a2eed);
  border:1px solid var(--line); border-radius:18px;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.7);
}
.bar {
  display:flex; align-items:center; gap:8px;
  padding:12px 18px; background:rgba(7,11,22,.6);
  border-bottom:1px solid var(--line);
}
.dot { width:10px; height:10px; border-radius:50%; }
.bar-title { font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); margin-left:4px; flex:1; }
.bar-title b { color:var(--cyan); }
.bar-scene { font-family:'Space Mono',monospace; font-size:10px; color:var(--amber); }
.body { padding:26px 24px; min-height:400px; }
.foot {
  border-top:1px solid var(--line); padding:10px 18px;
  display:flex; justify-content:space-between;
  font-family:'Space Mono',monospace; font-size:10px; color:var(--muted);
}

/* TYPOGRAPHY */
.eyebrow { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--cyan); margin-bottom:8px; }
h1 { font-size:clamp(22px,5vw,36px); font-weight:700; line-height:1.1; margin-bottom:6px; }
.g1 { background:linear-gradient(90deg,#fff,var(--cyan)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.g2 { background:linear-gradient(90deg,var(--cyan),var(--purple)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.tagline { color:var(--muted); font-size:14px; margin:8px 0 18px; line-height:1.6; }

/* BUTTONS */
.btn {
  display:inline-flex; align-items:center; gap:6px;
  font-family:'Space Grotesk',sans-serif; font-weight:600;
  font-size:14px; padding:11px 20px; border-radius:10px;
  border:none; cursor:pointer; transition:transform .12s, filter .12s;
}
.btn:hover { transform:translateY(-2px); filter:brightness(1.08); }
.btn-primary { background:linear-gradient(90deg,var(--cyan),var(--blue)); color:#06111f; }
.btn-gold    { background:linear-gradient(90deg,var(--gold),var(--amber)); color:#06111f; }
.btn-ghost   { background:transparent; color:var(--text); border:1px solid var(--line); }
.btn-sm      { font-size:12px; padding:8px 14px; }

/* INPUT */
.input-row { display:flex; gap:10px; margin:16px 0; flex-wrap:wrap; }
.nick-input {
  flex:1; min-width:180px; padding:11px 14px;
  background:var(--panel); border:1px solid var(--line);
  border-radius:10px; color:var(--text);
  font-family:'Space Grotesk',sans-serif; font-size:15px; outline:none;
  transition:border-color .2s;
}
.nick-input:focus { border-color:var(--cyan); }

/* PRIZES BOX */
.prizes {
  padding:14px 16px; background:rgba(245,158,11,.07);
  border:1px solid rgba(245,158,11,.3); border-radius:12px;
  margin-bottom:18px;
}
.prizes-title { font-family:'Space Mono',monospace; font-size:10px; color:var(--gold); letter-spacing:2px; margin-bottom:8px; }
.prize-row { display:flex; align-items:center; gap:10px; font-size:13px; margin-bottom:4px; }

/* TOPICS GRID */
.topics { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 0; }
.topic {
  padding:14px; background:var(--panel);
  border:1px solid var(--line); border-radius:12px;
  cursor:pointer; text-align:left; color:var(--text);
  transition:border-color .15s, transform .12s;
  display:flex; flex-direction:column; gap:4px;
}
.topic:hover { transform:translateY(-2px); }
.topic .t-ic { font-size:20px; }
.topic .t-name { font-weight:700; font-size:14px; }
.topic .t-speaker { font-size:11px; color:var(--muted); }
.topic .t-pts { font-family:'Space Mono',monospace; font-size:10px; margin-top:4px; }
.topic.c1 { border-color:rgba(45,212,255,.3); } .topic.c1:hover { border-color:var(--cyan); } .topic.c1 .t-pts { color:var(--cyan); }
.topic.c2 { border-color:rgba(59,107,255,.3); } .topic.c2:hover { border-color:var(--blue); } .topic.c2 .t-pts { color:#7a9eff; }
.topic.c3 { border-color:rgba(255,77,109,.3); } .topic.c3:hover { border-color:var(--red); }  .topic.c3 .t-pts { color:var(--red); }
.topic.c4 { border-color:rgba(255,184,77,.3); } .topic.c4:hover { border-color:var(--amber); }.topic.c4 .t-pts { color:var(--amber); }
.topic.c5 { border-color:rgba(57,224,138,.3); } .topic.c5:hover { border-color:var(--green); }.topic.c5 .t-pts { color:var(--green); }
.topic.c6 { border-color:rgba(167,139,250,.3); }.topic.c6:hover { border-color:var(--purple);}  .topic.c6 .t-pts { color:var(--purple); }

/* PROGRESS */
.progress { display:flex; align-items:center; gap:12px; margin-bottom:16px; }
.track { flex:1; height:7px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
.fill { height:100%; background:linear-gradient(90deg,var(--cyan),var(--blue)); border-radius:99px; transition:width .4s; }
.count { font-family:'Space Mono',monospace; font-size:12px; color:var(--muted); white-space:nowrap; }
.count b { color:var(--text); }

/* QUESTION */
.qtag { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--cyan); margin-bottom:8px; }
.question { font-size:clamp(17px,3vw,22px); font-weight:700; line-height:1.35; margin-bottom:18px; }

/* OPTIONS */
.options { display:flex; flex-direction:column; gap:10px; }
.opt {
  display:flex; align-items:flex-start; gap:12px;
  padding:12px 14px; background:var(--panel);
  border:1px solid var(--line); border-radius:11px;
  cursor:pointer; color:var(--text); font-size:14px;
  text-align:left; transition:border-color .15s, background .15s;
  font-family:'Space Grotesk',sans-serif;
}
.opt:hover:not(:disabled) { border-color:var(--cyan); background:rgba(45,212,255,.05); }
.opt .key {
  flex:none; width:26px; height:26px; border-radius:7px;
  font-family:'Space Mono',monospace; font-size:12px; font-weight:700;
  display:grid; place-items:center;
  background:rgba(255,255,255,.06); border:1px solid var(--line); color:var(--muted);
}
.opt.correct { border-color:var(--green); background:rgba(57,224,138,.1); }
.opt.correct .key { background:var(--green); color:#04140b; border-color:var(--green); }
.opt.wrong { border-color:var(--red); background:rgba(255,77,109,.1); }
.opt.wrong .key { background:var(--red); color:#1a0309; border-color:var(--red); }
.opt.dim { opacity:.4; }
.opt:disabled { cursor:default; }

/* EXPLAIN */
.explain {
  margin-top:14px; padding:14px; border-radius:10px;
  border:1px solid var(--line); background:rgba(59,107,255,.07);
  font-size:13.5px; line-height:1.65; display:none;
}
.explain.show { display:block; animation:rise .3s ease; }
.explain-head { font-family:'Space Mono',monospace; font-size:11px; letter-spacing:1px; text-transform:uppercase; margin-bottom:6px; }
.explain.ok .explain-head { color:var(--green); }
.explain.no .explain-head { color:var(--red); }
.explain b { color:var(--cyan); }
.pts-badge { display:inline-block; font-family:'Space Mono',monospace; font-size:12px; color:var(--gold); border:1px solid var(--gold); border-radius:6px; padding:2px 8px; margin-left:8px; }

/* NAV */
.nav { display:flex; justify-content:space-between; align-items:center; margin-top:18px; gap:10px; flex-wrap:wrap; }

/* SCORE RING */
.result { text-align:center; padding:8px 0; }
.ring-wrap { position:relative; width:150px; height:150px; margin:10px auto 16px; }
.ring-svg { transform:rotate(-90deg); }
.ring-circle { fill:none; stroke:rgba(255,255,255,.08); stroke-width:12; }
.ring-progress { fill:none; stroke:var(--cyan); stroke-width:12; stroke-linecap:round; transition:stroke-dashoffset .8s ease; }
.ring-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:28px; font-weight:700; }
.ring-sub { font-size:14px; color:var(--muted); }
.rank { font-size:22px; font-weight:700; margin-bottom:6px; }
.rank.hi { color:var(--green); } .rank.mid { color:var(--cyan); } .rank.lo { color:var(--amber); }
.result p { color:var(--muted); font-size:14px; max-width:46ch; margin:0 auto 18px; }
.result .btn { margin:5px; }

/* LEADERBOARD */
.lb-panel { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:16px; }
.lb-title { font-family:'Space Mono',monospace; font-size:10px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:10px; }
.lb-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.lb-row:last-child { border-bottom:none; }
.lb-row.me { background:rgba(45,212,255,.06); border-radius:8px; padding:8px 10px; margin:0 -10px; }
.lb-pos { font-family:'Space Mono',monospace; font-size:14px; width:28px; text-align:center; }
.lb-name { flex:1; font-weight:600; font-size:14px; }
.lb-pts { font-family:'Space Mono',monospace; font-size:13px; color:var(--gold); font-weight:700; }

/* TOPIC RECAP */
.recap { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0 20px; }
.recap-card { padding:10px; background:var(--panel); border:1px solid var(--line); border-radius:9px; text-align:center; }
.recap-ic { font-size:16px; margin-bottom:3px; }
.recap-score { font-family:'Space Mono',monospace; font-size:12px; font-weight:700; }
.recap-name { font-size:9px; color:var(--muted); margin-top:2px; }
.recap-card.p { border-color:rgba(57,224,138,.4); } .recap-card.p .recap-score { color:var(--green); }
.recap-card.h { border-color:rgba(255,184,77,.4); } .recap-card.h .recap-score { color:var(--amber); }
.recap-card.l { border-color:rgba(255,77,109,.4); } .recap-card.l .recap-score { color:var(--red); }

/* QR */
.qr-box { display:inline-block; background:#fff; padding:14px; border-radius:12px; margin:14px auto; box-shadow:0 0 30px rgba(45,212,255,.2); }

@keyframes rise { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
@media(max-width:520px) {
  .topics { grid-template-columns:1fr; }
  .recap  { grid-template-columns:1fr 1fr; }
  .body   { padding:20px 14px; }
}
</style>
</head>

function sbLoad(cb) {
  fetch(SB+"/rest/v1/leaderboard?select=nickname,pts&order=pts.desc&limit=20",{headers:sbH()})
  .then(function(r){return r.json();})
  .then(function(d){ if(Array.isArray(d)) { LB=d.map(function(r){return{name:r.nickname,pts:r.pts};}); } if(cb) cb(); })

function sbSave(name, pts) {
  // update local cache
  var i=LB.findIndex(function(e){return e.name===name;});
  if(i>=0){if(pts>LB[i].pts)LB[i].pts=pts;}else{LB.push({name:name,pts:pts});}
  LB.sort(function(a,b){return b.pts-a.pts;});
  // save to DB
  fetch(SB+"/rest/v1/leaderboard?nickname=eq."+encodeURIComponent(name),{headers:sbH()})
  .then(function(r){return r.json();})
  .then(function(rows){
    if(rows&&rows.length>0){
      if(pts>rows[0].pts){fetch(SB+"/rest/v1/leaderboard?id=eq."+rows[0].id,{method:"PATCH",headers:sbH(),body:JSON.stringify({pts:pts})}).catch(function(){});}
    } else {
      fetch(SB+"/rest/v1/leaderboard",{method:"POST",headers:Object.assign({},sbH(),{"Prefer":"return=minimal"}),body:JSON.stringify({nickname:name,pts:pts})}).catch(function(){});
    }
  }).catch(function(){});
}

function doAnswer(i) {
  if(ANS) return; ANS=true;
  var s=SESS[CUR]; var q=s.qs[QI];
  var ok=i===q.ok;
  if(ok) SP+=s.ppp;

  BD.querySelectorAll(".opt").forEach(function(b,j){
    b.disabled=true;
    if(j===q.ok) b.classList.add("correct");
    else if(j===i) b.classList.add("wrong");
    else b.classList.add("dim");
  });

  var ex=document.getElementById("ex");
  ex.classList.add("show",ok?"ok":"no");
  document.getElementById("exh").innerHTML=ok
    ?"✓ Risposta corretta <span class='pts-badge'>+"+s.ppp+" pt</span>"
    :"✗ Risposta errata";
  document.getElementById("exb").innerHTML=q.why;

  var last=QI===s.qs.length-1;
  var nb=document.createElement("button");
  nb.className="btn btn-primary";
  nb.textContent=last?"Vedi risultato →":"Prossima domanda →";
  nb.onclick=function(){if(last)showSessResult();else{QI++;showQ();}};
  document.getElementById("nav").appendChild(nb);
  nb.focus();
}
